<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Uğur Berktaş — DevOps &amp; Cloud Engineer</title>
  <desc id="desc">Lacivert ve mavi tonlarda modern profil başlığı</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0d2848"/>
      <stop offset="1" stop-color="#0b4f6c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="22" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="260" fill="url(#glow)"/>
  <circle cx="128" cy="260" r="210" fill="url(#glow)" opacity=".65"/>

  <g opacity=".18" fill="none" stroke="#7dd3fc">
    <path d="M0 218C180 155 286 273 455 212S742 139 897 196s228 16 303-21"/>
    <path d="M0 239C176 176 299 292 467 232s286-71 441-14 221 11 292-18"/>
    <circle cx="1036" cy="68" r="108"/>
    <circle cx="1036" cy="68" r="82"/>
  </g>

  <g transform="translate(84 67)" filter="url(#shadow)">
    <rect width="62" height="62" rx="16" fill="#0ea5e9"/>
    <path d="M20 21h22M20 31h14M20 41h18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#f8fafc">
    <text x="170" y="112" font-size="48" font-weight="750" letter-spacing="-.8">Uğur Berktaş</text>
    <text x="86" y="181" font-size="25" font-weight="500" fill="#7dd3fc">DEVOPS • CLOUD • BACKEND • OBSERVABILITY</text>
    <text x="87" y="224" font-size="18" fill="#cbd5e1">Automating reliable systems, one deployment at a time.</text>
  </g>

  <g transform="translate(1010 151)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-34 1h24l10-19 18 38 12-19h34" stroke="#7dd3fc" stroke-width="5"/>
    <circle cx="-45" cy="1" r="6" fill="#38bdf8" stroke="none"/>
    <circle cx="75" cy="1" r="6" fill="#38bdf8" stroke="none"/>
  </g>
</svg>
